name: nlops

# 元案 §3 の構成をそのまま立てる。
#
#   Browser → Nginx (静的配信 + /api リバースプロキシ) → BFF → Microservices → PostgreSQL
#
# ホストへ公開するのは Nginx だけ。DB も BFF も各サービスも内部ネットワークに閉じる。
# LLM はホスト側の llama-swap をそのまま使う (VRAM を二重に消費しないため)。
#
# 秘密情報は環境変数に置かない。docker inspect や /proc/<pid>/environ から読め、
# 子プロセスへも自動的に引き継がれるため。Docker secrets としてファイルで渡し、
# コンテナ内では /run/secrets 以下 (tmpfs) にマウントされる。
# 生成は make secrets (deploy/secrets/ は追跡しない)。

x-service: &service
  build:
    context: ..
    dockerfile: deploy/Dockerfile.go
  restart: unless-stopped
  environment:
    NLOPS_DSN_FILE: /run/secrets/db_dsn
  secrets:
    - db_dsn
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:18.3
    restart: unless-stopped
    environment:
      POSTGRES_DB: nlops
      POSTGRES_USER: nlops
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      # Postgres 18 以降は /var/lib/postgresql にマウントする
      # (data 直下に置くと起動時に unused mount として弾かれる)。
      - db-data:/var/lib/postgresql
      # 初回起動時に 001 → 002 → 003 の順で流れる。
      - ../services/schema:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nlops -d nlops"]
      interval: 3s
      timeout: 3s
      retries: 30

  customer:
    <<: *service
    command: ["customer", "-addr", ":9101"]
  order:
    <<: *service
    command: ["order", "-addr", ":9102"]
  inventory:
    <<: *service
    command: ["inventory", "-addr", ":9103"]
  shipping:
    <<: *service
    command: ["shipping", "-addr", ":9104"]
  billing:
    <<: *service
    command: ["billing", "-addr", ":9105"]

  bff:
    <<: *service
    command: ["bff", "-addr", ":8080", "-base", "${NLOPS_LLM_BASE:-http://host.docker.internal:11435}"]
    environment:
      # 監査の記録先。業務データと同じ DB の audit schema。
      NLOPS_DSN_FILE: /run/secrets/db_dsn
      # カタログの base_url を compose 内のホスト名で上書きする。
      NLOPS_BASE_CUSTOMER: http://customer:9101
      NLOPS_BASE_ORDER: http://order:9102
      NLOPS_BASE_INVENTORY: http://inventory:9103
      NLOPS_BASE_SHIPPING: http://shipping:9104
      NLOPS_BASE_BILLING: http://billing:9105
    secrets:
      - db_dsn
    extra_hosts:
      # ホストで動いている llama-swap (:11435) へ出るため。
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      customer:
        condition: service_started
      order:
        condition: service_started
      inventory:
        condition: service_started
      shipping:
        condition: service_started
      billing:
        condition: service_started

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    # ここだけがホストへの入口。
    ports:
      - "${NLOPS_PORT:-8081}:80"
      - "${NLOPS_TLS_PORT:-8443}:443"
    volumes:
      # 証明書があれば HTTPS が有効になる。無ければ HTTP のみ。
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - bff

volumes:
  db-data:

secrets:
  # postgres は POSTGRES_PASSWORD_FILE、Go 側は NLOPS_DSN_FILE として読む。
  # 同じパスワードから make secrets が両方を生成するのでずれない。
  db_password:
    file: ./secrets/db_password
  db_dsn:
    file: ./secrets/db_dsn
